# Shared CI and deploy for web apps: implements app-template's decision 008 (runtime & deploy
# contract). Each app calls it from a small ci.yml (see README.md):
#   PRs:            secrets + conformance + check + image (build, E2E against the image), no push, no deploy
#   default branch: secrets + conformance + check + image + push ghcr.io/<owner>/<app>:<sha> + deploy to the Pi
# All jobs run on native arm64 runners, so the image tested is the image deployed.
name: app

on:
  workflow_call:
    inputs:
      app-name:
        description: "App name: image name and deploy argument. Default: the repo name."
        type: string
        default: ""
      postgres-version:
        description: "Postgres major for the test database (match rpi-infra)."
        type: string
        default: "18"
      seed-command:
        description: "Seeds the database at $DATABASE_URL before E2E. Runs after the app migrated."
        type: string
        default: "npm run db:seed --if-present"
      e2e-command:
        description: "Runs Playwright against $BASE_URL (the running image)."
        type: string
        default: "npm run test:e2e"
      deploy:
        description: "Deploy to the Pi after pushing. Set false until the app is set up on the Pi."
        type: boolean
        default: true
    # Passed with `secrets: inherit`; only the deploy job uses them. See README.md.
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      DEPLOY_SSH_KEY:
        required: false
      DEPLOY_HOST:
        required: false
      DEPLOY_KNOWN_HOSTS:
        required: false

env:
  APP: ${{ inputs.app-name || github.event.repository.name }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.app-name || github.event.repository.name }}:${{ github.sha }}
  PGPASSWORD: postgres

jobs:
  # gitleaks over the full history (secrets.yml). $/ is this repo at this workflow's commit, so
  # app.yml@<branch> tests both together.
  secrets:
    uses: $/.github/workflows/secrets.yml
    permissions:
      contents: read

  # Drift from app-template's STACK.md (scripts/check-conformance.sh). The script is checked out
  # from this repo at the same commit as this workflow, so app.yml@<branch> tests both together.
  conformance:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared
          sparse-checkout: scripts/check-conformance.sh
          sparse-checkout-cone-mode: false
      - run: .shared/scripts/check-conformance.sh .

  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:${{ inputs.postgres-version }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:${{ inputs.postgres-version }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # for the seed script and Playwright, not the image

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Host network: the app reaches the Postgres service on localhost, Playwright reaches the app.
      - name: Start image
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL -e LOG_LEVEL=debug "$IMAGE"
          for _ in $(seq 60); do
            curl -fsS "$BASE_URL/healthz" && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || break
            sleep 1
          done
          echo "::error::App did not become healthy on $BASE_URL/healthz"
          docker logs app
          exit 1
      - name: Seed
        run: ${{ inputs.seed-command }}
      - name: E2E (WebKit)
        run: |
          npx playwright install --with-deps webkit
          ${{ inputs.e2e-command }}
      - name: App logs
        if: always()
        run: docker logs app || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      # Push the image that just passed E2E, unchanged. Default branch pushes only.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: docker push "$IMAGE"

  deploy:
    needs: [secrets, conformance, check, image]
    if: inputs.deploy && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions: {}
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check deploy secrets
        env:
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$TS_ID" ] || missing+=" TS_OAUTH_CLIENT_ID"
          [ -n "$TS_SECRET" ] || missing+=" TS_OAUTH_SECRET"
          [ -n "$KEY" ] || missing+=" DEPLOY_SSH_KEY"
          [ -n "$HOST" ] || missing+=" DEPLOY_HOST"
          [ -n "$KNOWN" ] || missing+=" DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing (set them with scripts/setup-github.sh, or pass deploy: false)"
            exit 1
          fi
      - name: Join tailnet as tag:ci (ephemeral)
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      # The deploy user's authorized_keys forces rpi-infra's deploy.sh; it gets "<app> <sha>".
      - name: Deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes "deploy@$HOST" "$APP" "$GITHUB_SHA"

# This repo's own check: lint the shared workflows, scripts and Renovate preset every repo depends on.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: shellcheck # preinstalled on ubuntu runners
        run: shellcheck scripts/*.sh

  renovate-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # Renovate's engines: node ^24
      # The preset every repo extends (default.json) and this repo's own config.
      - name: renovate-config-validator
        run: npx --yes --package renovate@44.155.2 -- renovate-config-validator --strict default.json renovate.json

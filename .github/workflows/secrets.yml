# Secret scan for every repo: GitHub secret scanning only covers public repos on the free plan.
# Runs gitleaks over the repo's full git history (seconds for these repos), with gitleaks.toml from
# this repo unless the calling repo has its own .gitleaks.toml. Apps get it as a job of app.yml;
# other repos call it from their own ci.yml (see README.md).
name: secrets

on:
  workflow_call:

env:
  # Release binary, not gitleaks-action (needs a license for orgs, runs JS). Bump both together:
  # the SHA-256 of linux_arm64.tar.gz from the release's gitleaks_<version>_checksums.txt.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080

jobs:
  gitleaks:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared
          sparse-checkout: gitleaks.toml
          sparse-checkout-cone-mode: false
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        run: |
          config=.shared/gitleaks.toml
          [ -f .gitleaks.toml ] && config=.gitleaks.toml
          echo "Config: $config"
          # .shared is not part of the history, so it is never scanned. --redact keeps secrets out of logs.
          "$RUNNER_TEMP/gitleaks" git . --config "$config" --redact --no-banner --verbose
